   <body>
        
       <div class="container-fluid">
            <div class="row">
                <div class="col-md-6 pd-0">
                    <div class="login-bg"></div>
                </div>
                <div class="col-md-6 pd-0">
                    <div class="login-pd">
                        <form action="">
                            <h3>Sign In</h3>
                            <div class="form-group">
                                <label for="fname" class="form-label">Email</label><br>
                                <input type="text" id="" name="fname" value="" class="form-control">
                            </div>
                            <div class="form-group">   
                                <label for="lname" class="form-label">Password</label><br>
                                <input type="text" id="" name="lname" value="" class="form-control">
                            </div>
                            <div class="form-group">   
                                <label>
                                    <input type="checkbox" checked="checked" name="remember"> Forgot password?
                                </label>
                            </div>
                             
                            
                            <div class="form-group">
                                <input type="submit" value="Sign In" class="btn btn-primary">
                            </div>
                            <hr>
                            <p>New here? <a href="register.html">Create an Account</a></p>
                            
                        </form> 
                    </div>
                </div>
           </div>
       </div>
